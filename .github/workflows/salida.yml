# Cómo sale juanamelio.ar a producción. Lo dispara el botón «Publicar» del
# tablero de Forge Studio: nadie corre esto a mano. Si termina bien, las
# tarjetas que estaban en Integrado pasan solas a En producción.
#
# Es el único camino a producción: Vercel no despliega solo al mergear ni arma
# vistas previas de los PRs (`git.deploymentEnabled: false` en vercel.json),
# igual que gym-app, a7sports y forge-studio (#53). Mergear integra; Publicar
# publica.
#
#   1. El portón: lint y tipos. Si no pasa, no sale nada. El build lo corre
#      Vercel en el paso siguiente, y si falla tampoco se publica.
#   2. El deploy, desde una copia limpia de la principal (`git archive`): sin
#      `.git` Vercel no mira quién escribió el commit, que en el plan Hobby
#      puede frenar un deploy, y ningún archivo local viaja.
#   3. Que https://juanamelio.ar conteste 200.
#
# Secreto del repo (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN — un token de vercel.com/account/tokens
name: salida

on:
  workflow_dispatch:

permissions:
  contents: read

# Una sola salida a la vez: dos deploys cruzados no dejan claro qué quedó arriba.
concurrency:
  group: salida
  cancel-in-progress: false

jobs:
  salida:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Lint y tipos
        run: npm run lint && npm run typecheck

      - name: Deploy a producción
        run: |
          mkdir -p "$RUNNER_TEMP/salida"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/salida"
          cd "$RUNNER_TEMP/salida"
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # El equipo y el proyecto `juanamelio` de Vercel. No son claves: dicen
          # a qué proyecto va, y sin el token no sirven para nada.
          VERCEL_ORG_ID: team_FqBc0tLfanZOwdOpVbhtJInZ
          VERCEL_PROJECT_ID: prj_jkrXohWmtfxylPpZ0iW36kBz0B2x

      - name: El sitio responde
        run: |
          codigo=$(curl -sL -o /dev/null -w '%{http_code}' https://juanamelio.ar)
          echo "https://juanamelio.ar → $codigo"
          test "$codigo" = 200
